<div class="top-wrapper" data-header data-minimize-offset="120">
  <header class="top">
    <div class="container top__wrapper">
      <a class="top__logo" href="#start"><img src="/images/logo.svg" alt="" width="40" height="52" /><span>{{site.name}}</span></a>
      <div class="top__contacts">
        <div class="top__contacts-item hidden-md">
          <div class="top__contacts-item-top">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>Adres
          </div>
          <div class="top__contacts-item-bottom">{{site.address}}, {{site.city}}</div>
        </div>
        <div class="top__contacts-item">
          <div class="top__contacts-item-top">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11 11 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.6 3.600a1 1 0 0 1-.25 1z"/></svg>Telefon
          </div>
          <div class="top__contacts-item-bottom"><a href="tel:{{site.phoneHref}}">{{site.phone}}</a></div>
        </div>
        <div class="top__contacts-item hidden-sm">
          <div class="top__contacts-item-top">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.500L4 7.500V17h16V7.500z"/></svg>Adres e-mail
          </div>
          <div class="top__contacts-item-bottom"><a href="mailto:{{site.email}}">{{site.email}}</a></div>
        </div>
        <a class="top__action" href="tel:{{site.phoneHref}}" aria-label="Zadzwoń / Umów wizytę" title="Zadzwoń / Umów wizytę">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11 11 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.6 3.600a1 1 0 0 1-.25 1z"/></svg>
        </a>
      </div>
      <button class="top__toggle" type="button" aria-expanded="false" aria-controls="main-nav" data-nav-toggle>
        <span class="sr-only">Menu</span><span class="top__burger" aria-hidden="true"></span>
      </button>
    </div>
  </header>
  <div class="navigation">
    <div class="container navigation__inner">
      <!-- logo i telefon widoczne dopiero, gdy górny pasek (.top) wyjedzie poza ekran -->
      <a class="navigation__logo" href="#start" aria-label="{{site.name}} — początek strony" tabindex="-1">
        <img src="/images/logo.svg" alt="" width="30" height="39" />
      </a>
      <nav id="main-nav" class="nav" aria-label="Główna nawigacja" data-nav>
        <ul class="nav__list">
          {{#each menu}}
          <li><a href="{{href}}">{{label}}</a></li>
          {{/each}}
        </ul>
      </nav>
      <a class="navigation__phone" href="tel:{{site.phoneHref}}" aria-label="Zadzwoń / Umów wizytę" title="Zadzwoń / Umów wizytę" tabindex="-1">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11 11 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.6 3.600a1 1 0 0 1-.25 1z"/></svg>
      </a>
    </div>
  </div>
</div>
